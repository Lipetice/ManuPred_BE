name: CI Java Maven Docker & Kubernetes

on:
  push:
    branches: [ "main" ]

jobs:
  # Job 1: Build da aplicação Java com Maven
  build-maven:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build do Projeto com Maven
        run: mvn clean package -DskipTests

      - name: Salvar Artefato JAR
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar

  # Job 2: Construção e Push da Imagem Docker
  docker-build:
    runs-on: ubuntu-latest
    needs: build-maven
    steps:
      - uses: actions/checkout@v4

      - name: Baixar Artefato JAR
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target/

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build da Imagem Docker
        run: docker build -t manupred_be .

      - name: Tag e Push da Imagem
        run: |
          docker tag manupred_be ${{ secrets.DOCKER_USERNAME }}/manupred_be:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/manupred_be:latest

  # Job 3: Implantação via Runner Self-Hosted
  deploy-k8s:
    runs-on: self-hosted
    needs: docker-build

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Parar container antigo
        continue-on-error: true
        run: docker stop manupred-be-app

      - name: Remover container antigo
        continue-on-error: true
        run: docker rm manupred-be-app

      # - O volume "manupred-uploads" guarda as fotos dos chamados. Sem ele, todo deploy
      #   (que apaga e recria o container) apagava todos os anexos.
      # - IA_API_KEY e GOOGLE_CLIENT_SECRET não eram repassados: em produção a IA ficava
      #   sempre "indisponível" e o login Google pelo site falhava. Cadastre esses secrets
      #   no repositório (se não existirem, ficam vazios e o resto funciona normalmente).
      # - ADMIN_PASSWORD: senha do admin criado automaticamente (admin@manupred.com) quando
      #   o banco ainda não tem nenhum ADMIN.
      - name: Rodar novo container
        run: |
          docker run -d --pull always --name manupred-be-app -p 8080:8080 \
            --restart unless-stopped \
            -v manupred-uploads:/app/uploads \
            -e SPRING_PROFILES_ACTIVE=prod \
            -e MONGODB_URI='${{ secrets.MONGODB_URI }}' \
            -e JWT_SECRET='${{ secrets.JWT_SECRET }}' \
            -e FIREBASE_CREDENTIALS_JSON='${{ secrets.FIREBASE_CREDENTIALS_JSON }}' \
            -e IA_API_KEY='${{ secrets.IA_API_KEY }}' \
            -e GOOGLE_CLIENT_SECRET='${{ secrets.GOOGLE_CLIENT_SECRET }}' \
            -e ADMIN_PASSWORD='${{ secrets.ADMIN_PASSWORD }}' \
            -e FRONTEND_OAUTH2_REDIRECT_URI='${{ secrets.FRONTEND_OAUTH2_REDIRECT_URI }}' \
            ${{ secrets.DOCKER_USERNAME }}/manupred_be:latest
