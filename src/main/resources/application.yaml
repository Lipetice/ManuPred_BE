spring:
  application:
    name: kipper
  # No Spring Boot 4 o endereço do banco fica em "spring.mongodb" (antes era "spring.data.mongodb").
  # No lugar antigo ele era ignorado: o back conectava no padrão localhost e gravava no banco "test".
  mongodb:
    # Lê do IntelliJ/Ambiente. Se não achar, usa o local.
    uri: ${MONGODB_URI:mongodb://localhost:27017/kipper_db}
  data:
    mongodb:
      auto-index-creation: true
  servlet:
    multipart:
      enabled: true
      # Cada foto pode ter até 10MB; o envio inteiro (várias fotos juntas) até 50MB
      max-file-size: 10MB
      max-request-size: 50MB
      resolve-lazily: false
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:355480871385-8q4850tqh2shrf6qkf5li497lgf9m42m.apps.googleusercontent.com}
            # Com valor padrão vazio a aplicação sobe mesmo sem a variável; o login Google
            # pelo site (redirect /oauth2) só funciona com GOOGLE_CLIENT_SECRET definido.
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope:
              - openid
              - profile
              - email
server:
  port: 8080
  shutdown: graceful
  tomcat:
    # Deixa o Tomcat terminar de receber um upload grande demais para conseguir devolver
    # a mensagem de erro (com o padrão de 2MB a conexão simplesmente caía).
    max-swallow-size: 100MB
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,mongo
  metrics:
    tags:
      application: ${spring.application.name}
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    try-it-out-enabled: true
    filter: true
    display-request-duration: true
    default-models-expand-depth: 1
    default-model-expand-depth: 1
  show-actuator: false
app:
  # Pasta dos anexos dos chamados (no Docker: /app/uploads, montada como volume)
  upload-dir: ${UPLOAD_DIR:uploads}
  # Admin criado automaticamente quando ainda não existe nenhum ADMIN no banco.
  # Só é criado se ADMIN_PASSWORD estiver definida (a senha não fica no repositório).
  admin:
    nome: ${ADMIN_NAME:Administrador}
    email: ${ADMIN_EMAIL:admin@manupred.com}
    password: ${ADMIN_PASSWORD:}
  jwt:
    secret: ${JWT_SECRET:TrocarPorUmaChaveAleatoriaDeProducaoComPeloMenos32Caracteres}
    # Validade do token de login. Com 30 minutos, o app desloga quem fica parado meia hora.
    expiracao-minutos: ${JWT_EXPIRACAO_MINUTOS:30}
  firebase:
    credentials-json: ${FIREBASE_CREDENTIALS_JSON:}
  google:
    web-client-id: ${GOOGLE_WEB_CLIENT_ID:355480871385-8q4850tqh2shrf6qkf5li497lgf9m42m.apps.googleusercontent.com}
  oauth2:
    redirect-uri: ${FRONTEND_REDIRECT_URI:http://localhost:5173/oauth2/redirect}
  ia:
    provedor: ${IA_PROVEDOR:gemini}
    api-key: ${IA_API_KEY:}
    modelo: ${IA_MODELO:gemini-3.8-flash}
    # A primeira chamada ao Gemini às vezes demora; com 20s ela caía em erro 503
    timeout-segundos: ${IA_TIMEOUT:40}
    limite-por-minuto: ${IA_LIMITE_MINUTO:10}
