spring:
  application:
    name: kipper
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3310}/kipper_db?createDatabaseIfNotExist=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:1234}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
server:
  port: 8080
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  metrics:
    tags:
      application: ${spring.application.name}
app:
  jwt:
    # Em produção, defina a variável de ambiente JWT_SECRET (>= 32 caracteres aleatórios)
    secret: ${JWT_SECRET:TrocarPorUmaChaveAleatoriaDeProducaoComPeloMenos32Caracteres}
  firebase:
    # Em produção, defina FIREBASE_CREDENTIALS_JSON com o conteúdo do service-account.json
    credentials-json: ${FIREBASE_CREDENTIALS_JSON:}
    generated-file-path: ${FIREBASE_CREDENTIALS_PATH:/tmp/firebase-service-account.json}
